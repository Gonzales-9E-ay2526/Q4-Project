<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profile - Student Portal System</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>

    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container-fluid" id="navleft">
        <div class="row">
            
            <div class="bg-light col-lg-2 p-5" style="height: 100vh; position: fixed;">
                <div class="text-center">
                    <a href="dashboard.html"><img src="Untitled.png" alt="Logo" class="rounded-5 img-fluid mb-4"></a>
                </div>
                <ul class="flex-column text-dark list-unstyled">
                    <li><a class="nav-link text-black mb-3" href="dashboard.html">Dashboard</a></li>
                    <li><a class="nav-link text-black mb-3" href="notebooks.html">Virtual Notebooks</a></li>
                    <li><a class="nav-link text-black mb-3" href="tasks.html">Tasks</a></li>
                    <li><a class="nav-link text-black fw-bold mb-3" href="profile.html">Profile</a></li>
                    <li><a class="nav-link text-black" href="index.html">Logout</a></li>
                </ul>
            </div>

            <div class="col-lg-10 offset-lg-2 p-5 bg-light min-vh-100 d-flex align-items-center justify-content-center" style="background-image: url('bg-pattern.png'); background-size: cover;">
                
                <div class="container bg-white shadow rounded-4 p-4" style="max-width: 900px;">
                    
                    <div class="mb-4">
                        <span class="badge bg-dark fs-5 px-3 py-2">PROFILE</span>
                        <p class="text-muted small mt-1">Student Information</p>
                    </div>

                    <div class="row align-items-center">
                        
                        <div class="col-md-5 text-center border-end mb-4 mb-md-0">
                            <img src="https://cdn-icons-png.flaticon.com/512/3135/3135715.png" alt="Profile Picture" class="rounded-circle mb-3 border border-3" style="width: 150px; height: 150px; object-fit: cover;">
                            
                            <div class="px-3">
                                <input class="form-control form-control-sm mb-2" type="file" id="chooseFile">
                                <button type="button" class="btn btn-outline-secondary btn-sm" onclick="alert('Profile picture uploaded successfully!')">To the stream</button>
                            </div>
                        </div>

                        <div class="col-md-7">
                            <h4 class="text-secondary mb-4 border-bottom pb-2">Student Information</h4>
                            
                            <div class="mb-3">
                                <label class="fw-bold text-muted small d-block">STUDENT ID</label>
                                <span class="fs-5 text-dark">09123456</span>
                            </div>

                            <div class="mb-3">
                                <label class="fw-bold text-muted small d-block">CONTACT NUMBER</label>
                                <span class="fs-5 text-dark">+639100000004</span>
                            </div>

                            <div class="mb-3">
                                <label class="fw-bold text-muted small d-block">EMAIL ADDRESS</label>
                                <span class="fs-5 text-dark text-decoration-underline text-primary">delacruz.jc@montessori.edu.ph</span>
                            </div>

                            <div class="mb-4">
                                <label class="fw-bold text-muted small d-block">GENDER</label>
                                <span class="fs-5 text-dark">Male</span>
                            </div>

                            <div class="d-grid gap-2">
                                <button class="btn btn-info text-white fw-bold py-2 shadow-sm rounded-3" type="button" onclick="alert('Redirecting to password update form...')">Change Password</button>
                            </div>
                        </div>

                    </div>
                </div>

            </div>

        </div>
    </div>

    <footer class="container-fluid bg-light text-dark text-center p-2 fixed-bottom border-top">
        @Montessori.education | Group No. __ | Grade 9 Section _____
    </footer>

</body>
</html>
