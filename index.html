<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Q4 Skills </title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    
    <link rel="stylesheet" href="style.css">

</head>
<body style="background-image: url('projectbg.webp'); background-size: cover; background-position: center;">
   
    <div class="d-flex log-in bg-light text-dark rounded-5 p-5 mt-5 mx-auto shadow flex-column align-items-center" style="min-height: 500px; width: 500px;">
        
        <img src="projectlogo.webp" alt="Logo" width="70" class="mb-4">
        <div class="container ps-5">

        <details ontoggle="alert('TEST CREDENTIALS: \nID: Student2526 \nPassword: Ms.Pascobest')">
            <summary class="btn btn-sm btn-outline-dark m-3"> View Login Help</summary>
            <p class="small text-dark m-3"><span class="bg-light">Enter the credentials shown in the alert box.<span></p>
        </details>
            
            <h1 class="fw-bold text-secondary mb-4 text-center">Login</h1>
            
                <form onsubmit="logIn(event)">
                
                <div class="mb-3 text-center">
                    <label for="username" class="form-label">Username</label>
                    <input type="text" class="form-control" id="username" placeholder="Enter Username">
                </div>

                <div class="mb-3 text-center">
                    <label for="password" class="form-label">Password</label>
                    <input type="password" class="form-control" id="password" placeholder="Enter Password">
                </div>

                
                <div class="form-check mb-3 text-start">
                    <label class="form-check-label" for="stayLoggedIn">
                    <input class="form-check-input" type="checkbox" id="stayLoggedIn">
                    Stay logged in
                </label>
                </div>

                <div class="d-flex gap-2 mb-3">
                    <button type="button" class="btn btn-primary btn-sm w-50" onclick="logIn(event)">
                        Login
                    </button>

                    <button type="submit" class="btn btn-outline-secondary btn-sm w-50">
                        Cancel
                    </button>
                </div>
                <hr>

                <div class="text-center">
                    <small class="text-muted">
                        Forgot username/password?
                    </small>
                </div>

            </form>
        </div>
    </div>
    <script src="main.js"></script>
</body>
</html>
